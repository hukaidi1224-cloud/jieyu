<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>借雨 · 热区核对</title>
    <style>
      body {
        margin: 0;
        background: #22262a;
        font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
      }
      .stage {
        position: relative;
        margin: 20px;
        overflow: hidden;
        box-shadow: 0 0 0 1px #000;
      }
      .stage img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .grid {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .grid i {
        position: absolute;
        background: rgba(255, 255, 255, 0.18);
      }
      .grid i.v {
        top: 0;
        bottom: 0;
        width: 1px;
      }
      .grid i.h {
        left: 0;
        right: 0;
        height: 1px;
      }
      .grid i.mid {
        background: rgba(255, 120, 120, 0.55);
      }
      .grid b {
        position: absolute;
        color: #ffd7a0;
        font-size: 11px;
        font-weight: 400;
        text-shadow: 0 1px 2px #000;
      }
      .spot {
        position: absolute;
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        border: 2px solid #c9a227;
        border-radius: 50%;
        background: rgba(242, 220, 120, 0.95);
      }
      .spot span {
        position: absolute;
        left: 16px;
        top: -4px;
        padding: 1px 5px;
        white-space: nowrap;
        font-size: 12px;
        color: #10161a;
        background: rgba(242, 235, 224, 0.94);
        border: 1px solid #10161a;
      }
      .spot.npc {
        border-color: #d4a017;
        background: #e0b030;
      }
      .spot.exit {
        border-color: #3d9a68;
        background: #4cb07a;
      }
      .spot.hub {
        border-color: #7eb8d4;
        background: #2c4a62;
      }
      .spot.verb {
        border-color: #8f877a;
        background: #d8c9a0;
      }
      h1 {
        margin: 16px 20px 0;
        font-size: 14px;
        color: #e8e0d0;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <div class="stage" id="stage"></div>
    <script type="module" src="./review.ts"></script>
  </body>
</html>
